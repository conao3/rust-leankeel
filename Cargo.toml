[package]
name = "leankeel"
version = "0.1.0"
edition = "2024"
description = "A linter for Lean 4 that applies Lean's own suggested fixes and verifies every change"
license = "Apache-2.0"
repository = "https://github.com/conao3/rust-leankeel"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
leanfran = { version = "=0.14.0", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[build-dependencies]
leanfran-build = "=0.14.0"
